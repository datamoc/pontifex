<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: none;">

  <!-- Filtres pour les effets de fumée -->
  <filter id="smoke" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>

  <!-- Filtres pour les escarbilles -->
  <filter id="sparks" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
    <feSpecularLighting result="specOut" in="blur" specularConstant="1" specularExponent="20" lighting-color="#fde047">
      <fePointLight x="0" y="0" z="200"/>
    </feSpecularLighting>
    <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
  </filter>

  <!-- Symbole pour la fumée -->
  <symbol id="smoke-cloud" viewBox="0 0 160 70">
    <path d="M46,18c2.63125,0 5.14382,0.50812 7.44494,1.4316c3.54136,-10.14963 13.19781,-17.4316 24.55506,-17.4316c11.35725,0 21.0137,7.28197 24.55506,17.4316c2.30112,-0.92348 4.81369,-1.4316 7.44494,-1.4316c11.04569,0 20,8.95431 20,20c6.62742,0 12,5.37258 12,12c0,6.62742 -5.37258,12 -12,12h-100c-6.62742,0 -12,-5.37258 -12,-12c0,-5.2291 3.34463,-9.67702 8.0113,-11.32117c-0.00752,-0.22535 -0.0113,-0.45165 -0.0113,-0.67883c0,-11.04569 8.95431,-20 20,-20z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M142,50c0,6.62742 -5.37258,12 -12,12h-100c-6.62742,0 -12,-5.37258 -12,-12c0,-1.59135 0.30976,-3.11035 0.87227,-4.5c1.78016,4.39775 6.09166,7.5 11.12773,7.5h100c5.03607,0 9.34756,-3.10225 11.12773,-7.5c0.56251,1.38965 0.87227,2.90865 0.87227,4.5z" fill="#e2e8f0" opacity="0.8"/>
  </symbol>

  <!-- Symbole pour les escarbilles -->
  <symbol id="sparks-particle" viewBox="0 0 10 10">
    <circle cx="5" cy="5" r="3" fill="#fde047" filter="url(#sparks)"/>
  </symbol>

  <!-- Symbole pour l'explosion -->
  <symbol id="explosion" viewBox="0 0 140 140">
    <g id="fire-outer">
      <path d="M127.53,70L110.98,82.03L124.62,105.1L98.07,102.4L92.34,118.92L75.99,111.63L61.47,129.34L56.33,99.93L34.53,110.93L33.39,93.53L0.86,90.3L31.64,70L10.75,52.6L37.57,49.16L27.58,21.04L52.9,32.56L60.29,2.45L75.28,33.31L95.83,13.43L97.51,38.25L120.46,37.57L106.26,59.35z" fill="#dc2626" stroke="#7f1d1d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g id="fire-mid">
      <path d="M111.92,70L92.11,78.05L101.6,96.52L82.79,92.15L77.62,113.2L65.72,94.25L47.95,108.19L47.82,88.61L31.33,84.07L41.75,70L29.52,55.27L52.36,55.2L49.88,35.15L64.98,41.53L78.67,20.82L82.23,48.82L109.61,36.76L95.39,60.76z" fill="#f97316" stroke="#9a3412" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g id="fire-core">
      <path d="M96.14,70L86.8,76.96L88.52,88.52L77.19,87.37L70,100.45L63.77,85.05L49.85,90.15L55.61,75.96L45.54,70L52.56,62.77L52.61,52.61L64.15,55.89L70,41.52L76.79,53.61L87.91,52.09L87.33,62.82z" fill="#fde047" stroke="#a16207" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M59,70a11,11 0 1,0 22,0a11,11 0 1,0 -22,0z" fill="#fffbeb"/>
    </g>
  </symbol>

  <!-- Symbole pour la flamme -->
  <symbol id="flame" viewBox="0 0 44 70">
    <g id="flame-outer">
      <path d="M22,68C6,66 2,50 12,38C14,46 18,46 18,40C18,26 26,18 24,2C38,16 46,34 40,50C38,62 30,68 22,68Z" fill="#f97316" stroke="#9a3412" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g id="flame-core">
      <path d="M22,66C13,64 12,54 18,46C20,52 24,52 24,46C30,52 32,60 28,64C26,66 24,66 22,66Z" fill="#fde047"/>
    </g>
  </symbol>

</svg>